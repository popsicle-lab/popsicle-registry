name: Notify Registry Website

on:
  push:
    branches: [main]
    # Only trigger when index files or config change (not README edits etc.)
    paths:
      - 'config.json'
      - '1/**'
      - '2/**'
      - '3/**'
      - '??/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: popsicle-lab/popsicle-registry-website
          event-type: registry-updated
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "pusher": "${{ github.actor }}"
            }
